<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Interactive Physics Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#172033;--muted:#667085;--line:#e4e7ec;--blue:#2563eb;--blue2:#eff6ff;--green:#15803d;--orange:#c2410c}
*{box-sizing:border-box}body{margin:0;background:transparent;color:var(--ink);font-family:'DM Sans',sans-serif}
.interactive-learning-lab{border:1px solid var(--line);border-radius:18px;background:#fff;overflow:hidden}
.il-head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;padding:22px;border-bottom:1px solid var(--line);background:#f8fafc}
.il-eyebrow,.il-kicker{font-size:11px;text-transform:uppercase;letter-spacing:.14em;font-weight:800;color:var(--blue)}
.il-head h3{margin:5px 0 6px;font:700 22px 'Space Grotesk'}
.il-head p{margin:0;color:var(--muted);line-height:1.5}
.il-head select{border:1px solid #d0d5dd;border-radius:10px;background:#fff;padding:10px 12px}
.il-grid{display:grid;grid-template-columns:1.35fr 1fr;gap:0}
.il-visual,.il-controls{padding:22px}.il-controls{border-left:1px solid var(--line);background:#fbfcfe}
.il-visual h3{font:700 23px 'Space Grotesk';margin:5px 0}.il-visual p{color:var(--muted);line-height:1.55}
.il-scene{height:150px;border:1px solid var(--line);border-radius:14px;display:flex;align-items:center;gap:18px;padding:22px;overflow:hidden;background:#fff}
.il-arrow{height:10px;max-width:82%;background:var(--blue);border-radius:99px;position:relative}.il-arrow:after{content:'';position:absolute;right:-10px;top:-5px;border-left:12px solid var(--blue);border-top:10px solid transparent;border-bottom:10px solid transparent}.il-arrow span{position:absolute;top:-26px;right:0;font-weight:800}
.il-block{width:86px;height:64px;border:2px solid var(--ink);border-radius:8px;display:grid;place-items:center;font-weight:800;flex:none}
.il-metric{display:flex;justify-content:space-between;align-items:end;padding:15px 0;border-bottom:1px solid var(--line)}.il-metric span{color:var(--muted)}.il-metric strong{font:700 24px 'Space Grotesk'}
.il-mini-graph{height:70px;margin-top:16px;border:1px solid var(--line);border-radius:10px;display:flex;align-items:end;padding:8px;background:#f8fafc}.il-mini-graph div{width:100%;background:var(--blue);border-radius:6px 6px 2px 2px}
.il-circuit{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:22px 0;padding:18px;border:1px solid var(--line);border-radius:14px}.il-circuit i{height:3px;min-width:35px;background:var(--blue);flex:1}.il-circuit b{padding:12px;border:2px solid var(--ink);border-radius:8px}
.il-wave{width:100%;height:120px;border:1px solid var(--line);border-radius:12px;margin:18px 0;background:#f8fafc}.il-wave polyline{fill:none;stroke:currentColor;stroke-width:3}
.il-controls label{display:block;font-weight:700;margin-bottom:20px}.il-controls label b{float:right}.il-controls input[type=range]{display:block;width:100%;margin-top:12px}
.il-static{padding:12px;border:1px solid var(--line);border-radius:10px;margin-bottom:18px}.il-predict{margin-top:24px;padding:16px;border-radius:14px;background:#fff;border:1px solid var(--line)}.il-predict>strong{font-size:11px;letter-spacing:.12em;color:var(--blue)}.il-predict p{line-height:1.5}
.il-predict button{display:block;width:100%;text-align:left;padding:10px 12px;margin:7px 0;border:1px solid var(--line);background:#fff;border-radius:9px;cursor:pointer}.il-predict button:hover{border-color:var(--blue);background:var(--blue2)}
.il-feedback{margin-top:10px;font-weight:700;line-height:1.45}.il-feedback.good{color:var(--green)}.il-feedback.try{color:var(--orange)}
@media(max-width:760px){.il-head,.il-grid{display:block}.il-controls{border-left:0;border-top:1px solid var(--line)}.il-head select{width:100%;margin-top:14px}}
</style>
</head>
<body>
<div id="lab"></div>
<script type="module">
import {renderLearningLab,initLearningLabs} from './js/interactive-lab.js';
const p=new URLSearchParams(location.search);
const topic=p.get('topic')||'Physics';
const source=p.get('source')||'ai-response';
document.querySelector('#lab').innerHTML=renderLearningLab({topic,source});
const root=document.querySelector('[data-il-root]');
if(root){
  const type=root.dataset.ilType;
  const select=root.querySelector('[data-il-lab]');
  if(select)select.value=type;
}
initLearningLabs();
</script>
</body>
</html>
