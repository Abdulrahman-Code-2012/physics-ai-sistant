<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f7f9fc"><title>physics AI-sistant — Sign in</title>
  <link rel="stylesheet" href="css/styles.css"><link rel="stylesheet" href="css/portal.css"><link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">
  <main class="auth-panel">
    <div class="auth-card">
      <div class="auth-brand"><div class="brand-mark">P</div><b>physics AI-sistant</b></div>
      <div class="auth-heading"><span class="eyebrow">WELCOME</span><h1>Sign in</h1><p>Use the username and password provided for your account.</p></div>
      <form id="form" novalidate>
        <label>Username<input class="portal-input" id="username" autocomplete="username" required placeholder="Username"></label>
        <label>Password<input class="portal-input" id="pw" type="password" autocomplete="current-password" required placeholder="••••••••"></label>
        <div id="msg" class="teacher-message" role="alert"></div>
        <button class="primary-btn auth-submit" id="go" type="submit">Sign in</button>
      </form>
      <p class="auth-note">Accounts are created and managed by your teacher.</p>
    </div>
  </main>
  <script type="module" src="js/login.js"></script>
</body>
</html>
